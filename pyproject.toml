[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merchant-ops-copilot"
version = "0.1.0"
description = "A Hindi/English ops agent for Razorpay merchants, built on the official Razorpay MCP server."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langfuse>=3.0",
    "gradio>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
copilot = "merchant_copilot.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merchant_copilot = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
