# Eval set for Merchant Ops Copilot. Runs against the frozen fixture week
# (src/merchant_copilot/data/fixtures.json, "now" = 28 Oct 2026 21:00 IST).
#
# Each case can check:
#   expect_tools      every one of these tools must be called
#   expect_any_tool   at least one of these must be called
#   answer_includes   list of groups; each group is a string or a list of
#                     alternatives, and one alternative must appear in the answer.
#                     Matching ignores case, "₹", commas and spaces inside numbers.
#   answer_excludes   none of these may appear
#   expect_draft      {kind, payment_id, amount_inr} the money-action draft must match,
#                     "allowed" if a draft is fine but not required, or omitted for "must not draft anything".
#   smoke             part of the 8-case subset CI runs on every push (the full set
#                     uses ~200k tokens, a whole day of Groq's free tier, so it runs nightly)
# Every case also fails if the executor ran: the eval never clicks Approve,
# so any executed refund means the guardrail leaked.

# --- Settlements -------------------------------------------------------------
- id: settlement_yesterday_low
  smoke: true
  category: settlements
  question: Why did yesterday's settlement come in low?
  expect_tools: [fetch_all_settlements, fetch_settlement_recon_details]
  answer_includes: ["892.84", "3499", ["refund"]]

- id: settlement_yesterday_low_hi
  category: settlements
  lang: hi
  question: कल का settlement इतना कम क्यों आया?
  expect_tools: [fetch_all_settlements, fetch_settlement_recon_details]
  answer_includes: ["892.84", "3499"]

- id: settlement_latest_utr
  category: settlements
  question: How much was my latest settlement, and what's the UTR?
  expect_tools: [fetch_all_settlements]
  answer_includes: ["2242.78", "UTIB832968817887"]

- id: settlement_week_total
  category: settlements
  question: How much money was settled to my bank in the last 7 days?
  expect_tools: [fetch_all_settlements]
  answer_includes: ["30601.16"]

- id: settlement_fees_hinglish
  category: settlements
  lang: hinglish
  question: Kal ke settlement mein Razorpay ki fees kitni kati?
  expect_any_tool: [fetch_all_settlements, fetch_settlement_recon_details]
  answer_includes: ["106.16"]

